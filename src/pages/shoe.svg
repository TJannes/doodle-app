<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <!-- Hides the upper's lines that lie behind the two straps. -->
    <mask id="behindStraps" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="800">
      <rect width="1200" height="800" fill="#fff"/>
      <rect x="470" y="168" width="215" height="105" rx="28" transform="rotate(7 470 168)" fill="#000"/>
      <rect x="372" y="312" width="240" height="96" rx="28" transform="rotate(36 372 312)" fill="#000"/>
    </mask>
  </defs>
  <g fill="none" stroke="#000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- sole -->
    <path d="M112 600 L1100 600 L1100 665 Q1100 705 1060 705 L170 705 Q100 705 100 650 Q100 615 112 600 Z"/>
    <path d="M135 632 H1078" stroke-width="5" stroke-dasharray="22 16"/>

    <g mask="url(#behindStraps)">
      <!-- lining showing at the top -->
      <path d="M546 128 Q550 98 590 96 L650 96 Q674 98 674 128"/>
      <!-- upper -->
      <path d="M112 600 C100 540 135 492 200 482 C280 470 340 420 380 380 L470 260 L520 150 Q528 128 550 128 L1080 128 Q1098 130 1098 148 L1100 600"/>
      <!-- collar trim -->
      <path d="M514 156 L1098 156"/>
      <!-- toe cap trim -->
      <path d="M155 506 C230 520 300 560 334 600"/>
      <!-- vamp trim -->
      <path d="M332 428 C410 510 520 540 600 562 C660 580 700 594 734 600"/>
      <!-- heel trim -->
      <path d="M1098 372 C1010 380 940 400 925 450 C912 500 908 560 906 600"/>
    </g>

    <!-- straps (hook-and-loop) -->
    <rect x="470" y="168" width="215" height="105" rx="28" transform="rotate(7 470 168)"/>
    <rect x="372" y="312" width="240" height="96" rx="28" transform="rotate(36 372 312)"/>
  </g>
  <!-- stitching on the straps (thinner) -->
  <g fill="none" stroke="#000" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round">
    <rect x="486" y="184" width="183" height="73" rx="16" transform="rotate(7 470 168)"/>
    <rect x="388" y="328" width="208" height="64" rx="16" transform="rotate(36 372 312)"/>
  </g>
</svg>
